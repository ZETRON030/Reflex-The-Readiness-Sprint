services:
 postgres:
  image: postgis/postgis:16-3.4
  restart: unless-stopped
  environment: {POSTGRES_DB: reflex,POSTGRES_USER: reflex,POSTGRES_PASSWORD: reflex}
  ports: ["5432:5432"]
  volumes: [pgdata:/var/lib/postgresql/data,./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U reflex -d reflex"],interval: 5s,timeout: 5s,retries: 10}
 redis:
  image: redis:7-alpine
  restart: unless-stopped
  ports: ["6379:6379"]
volumes: {pgdata: {}}